# ── Trino Delta Lake Connector — Trino 435 ──────────────────────────
# Usa o filesystem nativo do Trino (não Hadoop S3A)
# hive.metastore.uri: Hive Metastore para armazenar metadados

connector.name=delta_lake

# Hive Metastore (thrift)
hive.metastore.uri=thrift://hive-metastore:9083
hive.metastore-timeout=30s

# ── Filesystem nativo S3 do Trino (não usa Hadoop S3A) ───────────
# Habilitado para evitar ClassNotFoundException de S3AFileSystem
fs.native-s3.enabled=true

# MinIO endpoint (path-style, sem SSL)
s3.endpoint=http://minio1:9000
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.region=us-east-1

# Delta Lake
delta.enable-non-concurrent-writes=true
delta.register-table-procedure.enabled=true

# Performance
delta.target-max-file-size=128MB
