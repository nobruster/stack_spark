spark.master                     spark://spark-master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               file:/opt/bitnami/spark/logs/events
spark.history.fs.logDirectory    file:/opt/bitnami/spark/logs/events
spark.history.provider           org.apache.spark.deploy.history.FsHistoryProvider

# ── Memória e cores (ambiente dev — 15GB RAM / container worker 2.5g) ────
# SPARK_WORKER_MEMORY=2g  →  worker oferece 2g para heap do executor
# Cálculo por container:
#   executor heap:      1500m  (cabe em 2g WORKER_MEMORY)
#   executor overhead:   384m  (JVM off-heap: buffers NIO, threads)
#   worker daemon:      ~200m
#   total:             ~2084m  <  2500m  (416m de margem para picos)
spark.driver.memory              1g
spark.executor.memory            1500m
spark.executor.memoryOverhead    384m
spark.cores.max                  6

# ── Tunning de memória Spark ─────────────────────────────────────
# fraction=0.80: 80% do heap (1200m) para execução+storage
# storageFraction=0.30: 30% para cache, 70% para execução/sort
# Execução disponível por executor: 1500 × 0.80 × 0.70 = 840m
spark.memory.fraction            0.80
spark.memory.storageFraction     0.30

# ── Paralelismo ──────────────────────────────────────────────────
# 400 partições: ~104k linhas/partição para 41.5M linhas
spark.sql.shuffle.partitions     400
spark.default.parallelism        400

# Fix: JVM nao encontra user.home quando uid=1001 nao esta em /etc/passwd (WSL2/Docker)
spark.jars.ivy                        /opt/bitnami/spark/.ivy2
spark.driver.extraJavaOptions         -Duser.home=/opt/bitnami/spark -Duser.name=spark
spark.executor.extraJavaOptions       -Duser.home=/opt/bitnami/spark -Duser.name=spark

# MinIO S3A
spark.hadoop.fs.s3a.endpoint              http://minio1:9000
spark.hadoop.fs.s3a.access.key            minioadmin
spark.hadoop.fs.s3a.secret.key            minioadmin
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false
