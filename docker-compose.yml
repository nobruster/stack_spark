services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./data/spark-events:/opt/bitnami/spark/logs/events
      - ./work:/opt/bitnami/spark/work
    networks:
      - spark-network

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_WORKER_DIR=/tmp/spark-worker
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '2.0'
    ports:
      - "8081:8081"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./data/spark-events:/opt/bitnami/spark/logs/events
      - ./work:/opt/bitnami/spark/work
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_WORKER_DIR=/tmp/spark-worker
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '2.0'
    ports:
      - "8082:8081"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./data/spark-events:/opt/bitnami/spark/logs/events
      - ./work:/opt/bitnami/spark/work
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-3
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_WORKER_DIR=/tmp/spark-worker
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '2.0'
    ports:
      - "8083:8081"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./data/spark-events:/opt/bitnami/spark/logs/events
      - ./work:/opt/bitnami/spark/work
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-history:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-history
    command:
      - /opt/bitnami/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    ports:
      - "18080:18080"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./data/spark-events:/opt/bitnami/spark/logs/events
    depends_on:
      - spark-master
    networks:
      - spark-network

  jupyter-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: jupyter-1
    user: root
    command:
      - /bin/bash
      - /opt/bitnami/spark/conf/jupyter-entrypoint.sh
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_DRIVER_HOST=jupyter-1
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-spark123}
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
    ports:
      - "8888:8888"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./config/spark/jupyter-entrypoint.sh:/opt/bitnami/spark/conf/jupyter-entrypoint.sh
      - ./data/spark-events:/opt/bitnami/spark/logs/events
      - ./work:/opt/bitnami/spark/work
    depends_on:
      - spark-master
    networks:
      - spark-network

  jupyter-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: jupyter-2
    user: root
    command:
      - /bin/bash
      - /opt/bitnami/spark/conf/jupyter-entrypoint.sh
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_DRIVER_HOST=jupyter-2
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-spark123}
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
    ports:
      - "8889:8888"
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./config/spark/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./config/spark/jupyter-entrypoint.sh:/opt/bitnami/spark/conf/jupyter-entrypoint.sh
      - ./data/spark-events:/opt/bitnami/spark/logs/events
      - ./work:/opt/bitnami/spark/work
    depends_on:
      - spark-master
    networks:
      - spark-network

  minio1:
    image: minio/minio
    container_name: minio1
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server http://minio{1...4}/data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio1:/data
    networks:
      - spark-network

  minio2:
    image: minio/minio
    container_name: minio2
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server http://minio{1...4}/data --console-address ":9001"
    volumes:
      - ./data/minio2:/data
    networks:
      - spark-network

  minio3:
    image: minio/minio
    container_name: minio3
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server http://minio{1...4}/data --console-address ":9001"
    volumes:
      - ./data/minio3:/data
    networks:
      - spark-network

  minio4:
    image: minio/minio
    container_name: minio4
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server http://minio{1...4}/data --console-address ":9001"
    volumes:
      - ./data/minio4:/data
    networks:
      - spark-network

  dremio:
    image: dremio/dremio-oss
    container_name: dremio
    environment:
      - DREMIO_MAX_HEAP_MEMORY_SIZE_MB=4096
      - DREMIO_MAX_DIRECT_MEMORY_SIZE_MB=2048
    deploy:
      resources:
        limits:
          memory: 8g
    ports:
      - "9047:9047"
      - "31010:31010"
      - "32010:32010"
      - "45678:45678"
    volumes:
      - ./data/dremio:/opt/dremio/data
      - ./data/dremio-spill:/opt/dremio/spill
    networks:
      - spark-network

  # ─────────────────────────────────────────────────────────────────
  # TRINO — Query Engine para a camada Gold (e Silver/Bronze ad-hoc)
  # Arquitetura: PostgreSQL (HMS backend) → Hive Metastore → Trino
  # Acesso: http://localhost:8086  (Trino UI)
  # ─────────────────────────────────────────────────────────────────

  postgres-metastore:
    image: postgres:15-alpine
    container_name: postgres-metastore
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spark-network

  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive-metastore
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Conexão JDBC com PostgreSQL (schema criado automaticamente na 1a execução)
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
      # Config customizada: S3A para MinIO + permissões
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '1.0'
    ports:
      - "9083:9083"
    volumes:
      - ./config/hive-metastore:/hive_custom_conf
    depends_on:
      postgres-metastore:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9083' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - spark-network

  trino-coordinator:
    image: trinodb/trino:435
    container_name: trino-coordinator
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
    ports:
      - "8086:8080"      # Trino Web UI → http://localhost:8086
    volumes:
      - ./config/trino/coordinator:/etc/trino
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/core-site.xml:/etc/trino/core-site.xml:ro
      - ./work/init-trino.sql:/etc/trino/init-trino.sql:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    restart: on-failure
    networks:
      - spark-network

  trino-worker-1:
    image: trinodb/trino:435
    container_name: trino-worker-1
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '2.0'
    volumes:
      - ./config/trino/worker:/etc/trino
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/core-site.xml:/etc/trino/core-site.xml:ro
    depends_on:
      - trino-coordinator
    restart: on-failure
    networks:
      - spark-network

  trino-worker-2:
    image: trinodb/trino:435
    container_name: trino-worker-2
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '2.0'
    volumes:
      - ./config/trino/worker:/etc/trino
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/core-site.xml:/etc/trino/core-site.xml:ro
    depends_on:
      - trino-coordinator
    restart: on-failure
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
